# Mirar y ver tu código pensar · Entendiendo Julia, desde dentro · AC Institut
# Jupyter Book 2 (motor MyST). Construir:  npx myst build --html
version: 1
project:
  id: julia-acinstitut
  title: Mirar y ver tu código pensar
  subtitle: Entendiendo Julia, desde dentro
  authors:
    - name: Antonio Chanes Espigares
  license: CC-BY-NC-SA-4.0
  github: https://github.com/achanesespigares/julia-acinstitut
  exclude:
    - herramientas/**
    - README.md
    - node_modules/**
    - lab/**
  toc:
    - file: index.md
    - file: capitulos/00-como-leer.md
    - file: capitulos/laboratorio.md
    - title: Parte I · Primeros pasos con Julia
      children:
        - file: capitulos/01-calculadora.md
        - file: capitulos/02-vectores.md
        - file: capitulos/03-indices-filtros.md
        - file: capitulos/04-decidir-repetir.md
        - file: capitulos/05-funciones.md
    - title: Parte II · Estructuras de datos
      children:
        - file: capitulos/06-cadenas.md
        - file: capitulos/07-tuplas-diccionarios.md
        - file: capitulos/08-matrices.md
        - file: capitulos/09-tipos-propios.md
        - file: capitulos/10-tablas.md
    - title: Parte III · Cálculo científico
      children:
        - file: capitulos/11-algebra-lineal.md
        - file: capitulos/12-graficos.md
        - file: capitulos/13-probabilidad.md
        - file: capitulos/14-ecuaciones-optimizacion.md
site:
  template: book-theme
  options:
    logo_text: ac | institut · Julia
    style: estilo/ac-institut.css
    folders: true
